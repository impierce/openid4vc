version: 2

updates:
  # Cargo updates become useful once Cargo.lock is committed (docs/PLAN.md, Phase B); until then
  # Dependabot only proposes changes to the version requirements in the manifests.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait for a release to settle before proposing it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch updates in one PR; major updates get their own.
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
