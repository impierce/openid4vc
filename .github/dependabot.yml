version: 2

updates:
  # Cargo.lock is committed, so these PRs update the lockfile (and the manifests for major bumps).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait for a release to settle before proposing it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch updates in one PR; major updates get their own.
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
