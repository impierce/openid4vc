name: Fuzz

on:
  pull_request:
    paths:
      - "**/src/**"
      - "fuzz/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    name: Discover targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every binary in the fuzz/ crate is a cargo-fuzz target.
      - id: list
        run: |
          targets=$(cargo metadata --no-deps --format-version 1 --manifest-path fuzz/Cargo.toml \
            | jq -c '[.packages[].targets[] | select(.kind | index("bin")) | .name]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      # Seconds per target: a short smoke run on PRs, a longer one on schedule or manual runs.
      FUZZ_TIME: ${{ github.event_name == 'pull_request' && 60 || 600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - run: cargo install cargo-fuzz --locked
      # Carry the corpus over between runs so each run builds on previous coverage.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # New inputs go to the (cached) corpus; the committed seeds are read alongside it.
      - run: fuzz/run.sh "$TARGET" "$FUZZ_TIME"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
