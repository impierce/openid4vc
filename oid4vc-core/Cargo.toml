[package]
name = "oid4vc-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core types and traits shared by the Rust implementations of the OpenID4VC specifications"
homepage.workspace = true
repository.workspace = true
keywords = ["oid4vc", "openid4vc", "openid", "did", "credentials"]
categories = ["authentication", "cryptography", "web-programming"]
readme = "README.md"
include = ["/src", "/README.md", "/CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1.0.70"
async-trait = "0.1.68"
base64 = "0.23"
derive_more = { version = "2.1.1", features = ["display"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getset = "0.1.2"
identity-kit.workspace = true
is_empty = "0.3.0"
jsonwebtoken.workspace = true
nutype.workspace = true
rand = "0.10"
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = "1.0"
serde_urlencoded.workspace = true
serde_with.workspace = true
tracing.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = []
test-utils = []
utoipa = ["dep:utoipa"]
