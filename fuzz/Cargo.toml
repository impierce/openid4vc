[package]
name = "oid4vc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the openid4vc workspace: `cargo +nightly fuzz run <target>` from this directory"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
identity-kit = { version = "0.2.1", default-features = false, features = ["did-key", "vc"] }
libfuzzer-sys = "0.4"
oid4vc-core = { path = "../oid4vc-core" }
oid4vci = { path = "../oid4vci" }
oid4vp = { path = "../oid4vp" }
siopv2 = { path = "../siopv2" }
serde = "1.0"
serde_json = "1.0"
url = "2"

# Every binary is a fuzz target; the Fuzz workflow discovers them from this manifest.

[[bin]]
name = "credential_offer"
path = "fuzz_targets/credential_offer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorization_request"
path = "fuzz_targets/authorization_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcql_query"
path = "fuzz_targets/dcql_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "issuance_messages"
path = "fuzz_targets/issuance_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "presentation_messages"
path = "fuzz_targets/presentation_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt"
path = "fuzz_targets/jwt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vp_token_validation"
path = "fuzz_targets/vp_token_validation.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# A workspace of its own: the fuzz targets build on nightly with sanitizers and never join the
# library workspace, which `exclude`s this directory.
[workspace]
