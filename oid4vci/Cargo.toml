[package]
name = "oid4vci"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the OpenID Connect OpenID for Verifiable Credential Issuance standard"
homepage.workspace = true
keywords = ["oid4vc", "openid4vc", "oid4vci", "OpenID"]
license.workspace = true
repository.workspace = true

[features]
default = []
utoipa = ["dep:utoipa"]

[dependencies]
oid4vc-core = { path = "../oid4vc-core" }
anyhow = "1.0"
chrono.workspace = true
derivative = "2.2.0"
getset.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
lazy_static = "1.4"
nutype.workspace = true
paste = "1.0"
pkce = "0.2"
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_with.workspace = true
tokio.workspace = true
thiserror.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
oid4vc-core = { path = "../oid4vc-core", features = ["test-utils"] }
wiremock = "0.5"
