[package]
name = "oid4vci"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Rust implementation of the OpenID Connect OpenID for Verifiable Credential Issuance standard"
homepage.workspace = true
keywords = ["oid4vc", "openid4vc", "oid4vci", "OpenID"]
license.workspace = true
repository.workspace = true

[features]
default = []
utoipa = ["dep:utoipa", "oid4vc-core/utoipa"]

[dependencies]
oid4vc-core.workspace = true
anyhow = "1.0"
chrono.workspace = true
getset.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
nutype.workspace = true
pkce = "0.2"
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_with.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
utoipa = { workspace = true, features = ["url"], optional = true }

[dev-dependencies]
oid4vc-core = { workspace = true, features = ["test-utils"] }
utoipa = { workspace = true, features = ["yaml"] }
wiremock = "0.6"
