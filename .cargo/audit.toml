[advisories]
ignore = [
    # ed25519-dalek 1.x (via did-key): keypairs are only created through did-key, which derives the public key from
    # the secret key, so signing is never performed with a mismatched public key.
    "RUSTSEC-2022-0093",
    # curve25519-dalek 3.x (via did-key): timing leak requires measuring local signing operations; no signing oracle is
    # exposed to remote parties.
    "RUSTSEC-2024-0344",
    # h2 0.3 (via axum 0.6 and wiremock 0.5): only used by test servers; the production HTTP client (reqwest 0.12) uses
    # a patched h2 0.4.
    "RUSTSEC-2026-0258",
    # quick-xml 0.39 (via iota-sdk -> object_store): object_store is never invoked, no XML is parsed.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rsa 0.8 (via iota-sdk -> fastcrypto): no RSA private-key operations are performed; no patched version exists.
    "RUSTSEC-2023-0071",
]
