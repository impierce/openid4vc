[package]
name = "oid4vc-manager"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Managers and an issuer server combining the OpenID4VCI, OpenID4VP and SIOPv2 implementations"
homepage.workspace = true
repository.workspace = true

[dependencies]
oid4vc-core.workspace = true
siopv2.workspace = true
oid4vp.workspace = true
oid4vci.workspace = true

anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
axum-auth = "0.8"
chrono.workspace = true
futures = "0.3"
getset.workspace = true
identity-kit = { workspace = true, features = ["did-key", "in-memory"] }
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_with.workspace = true
tokio.workspace = true
tower-http = { version = "0.7", features = ["cors"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
oid4vc-core = { workspace = true, features = ["test-utils"] }

ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
identity-kit.workspace = true
rand = "0.10"
rstest = "0.28"
uuid = { version = "1.4", features = ["v4", "fast-rng"] }
wiremock = "0.6"
