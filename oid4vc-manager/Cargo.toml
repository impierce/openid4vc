[package]
name = "oid4vc-manager"
version = "0.1.0"
edition = "2021"
description = "Rust library combining the OpenID4VCI, OpenID4VP and SIOPv2 implementations into one easy-to-use interface"
homepage.workspace = true
keywords = ["oid4vc", "openid4vc", "openid", "did", "credentials"]
license.workspace = true
repository.workspace = true

[dependencies]
oid4vc-core = { path = "../oid4vc-core", version = "0.1.0" }
siopv2 = { path = "../siopv2", version = "0.1.0" }
oid4vp = { path = "../oid4vp", version = "0.1.0" }
oid4vci = { path = "../oid4vci", version = "0.1.0" }

anyhow = "1.0"
async-trait = "0.1"
axum = "0.6"
axum-auth = "0.4"
chrono.workspace = true
derivative = "2.2"
did-key.workspace = true
did_url = "0.1"
futures = "0.3"
getset.workspace = true
identity_credential.workspace = true
jsonwebtoken.workspace = true
lazy_static = "1.4.0"
paste = "1.0"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_with.workspace = true
tokio.workspace = true
tower-http = { version = "0.4", features = ["cors"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
oid4vc-core = { path = "../oid4vc-core", version = "0.1.0", features = ["test-utils"] }

ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
identity_did.workspace = true
identity_document.workspace = true
identity_jose.workspace = true
identity_verification.workspace = true
lazy_static = "1.4"
rand = "0.8"
rstest = "0.18"
uuid = { version = "1.4", features = ["v4", "fast-rng"] }
wiremock = "0.5"
