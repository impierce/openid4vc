[package]
name = "siopv2"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Rust implementation of the OpenID Connect Self-Issued OpenID Provider v2 standard"
homepage.workspace = true
repository.workspace = true
keywords = ["oid4vc", "openid4vc", "siopv2", "openid", "did"]
categories = ["authentication", "cryptography", "web-programming"]
readme = "README.md"
include = ["/src", "/README.md", "/CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
oid4vc-core = { path = "../oid4vc-core", version = "0.2.0" }

anyhow = "1.0.70"
async-trait = "0.1.68"
chrono.workspace = true
did_url = "0.1.0"
futures = "0.3"
getset.workspace = true
is_empty = "0.3.0"
jsonwebtoken.workspace = true
monostate.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_with.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { version = "2.3.1", features = ["serde"] }

[dev-dependencies]
oid4vc-core = { path = "../oid4vc-core", features = ["test-utils"] }

derivative = "2.2.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
lazy_static = "1.4.0"
rand = "0.10"
wiremock = "0.6.5"
