[package]
name = "oid4vc"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the OpenID4VC standards"
homepage = "https://www.impierce.com/"
keywords = ["openid4vc", "siopv2", "openid4vp", "openid4vci", "OpenID"]
license = "Apache-2.0"
repository = "https://github.com/impierce/openid4vc"
rust-version.workspace = true
# The facade is a convenience for this repository and is never released (docs/adr/0002-facade-crate.md).
publish = false

[workspace]
members = ["oid4vc-core", "oid4vci", "oid4vp", "siopv2", "oid4vc-manager"]
# The fuzz targets build on nightly with sanitizers and form a workspace of their own (fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
homepage = "https://www.impierce.com/"
license = "Apache-2.0"
repository = "https://github.com/impierce/openid4vc"
# Minimum supported Rust version, checked in CI (QA / MSRV) against the committed Cargo.lock.
rust-version = "1.95"

[workspace.dependencies]
chrono = "0.4"
getset = "0.1"
http = "1.3.1"
identity_credential = { git = "https://github.com/iotaledger/identity", tag = "v1.9.13-beta.1", default-features = false, features = [
    "credential",
    "presentation",
] }
identity-kit = { version = "0.2.1", default-features = false }
is_empty = "0.3"
# The pure-Rust backend; `aws_lc_rs` would pull in a C library.
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
monostate = "1.0"
nutype = { version = "0.8", features = ["serde"] }
# `rustls` with `ring`, installed by `oid4vc_core::http_client`; reqwest's own `rustls` feature would pull in
# `aws-lc-rs`.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
reqwest-middleware = { version = "0.5", features = ["json", "form"] }
reqwest-retry = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_with = "3.0"
tokio = { version = "1.46", features = ["rt", "macros", "rt-multi-thread"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["attributes", "std", "log"] }
url = { version = "2", features = ["serde"] }
utoipa = "6.0"

[dependencies]
oid4vc-core = { path = "oid4vc-core" }
oid4vci = { path = "oid4vci" }
oid4vp = { path = "oid4vp" }
siopv2 = { path = "siopv2" }
oid4vc-manager = { path = "oid4vc-manager" }

# identity_* v1.9.13-beta.1 pulls in IOTA v1.29.0, which takes `fastcrypto` from both crates.io and git and unifies
# them with this patch in its own workspace; patches don't reach dependents, so we repeat it. It goes away with the
# identity_* dependencies.
[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"
