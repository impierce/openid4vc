[package]
name = "oid4vc"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the OpenID4VC standards"
homepage = "https://www.impierce.com/"
keywords = ["openid4vc", "siopv2", "openid4vp", "openid4vci", "OpenID"]
license = "Apache-2.0"
repository = "https://github.com/impierce/openid4vc"

[workspace]
members = ["oid4vc-core", "oid4vci", "oid4vp", "siopv2", "oid4vc-manager"]

[workspace.package]
homepage = "https://www.impierce.com/"
license = "Apache-2.0"
repository = "https://github.com/impierce/openid4vc"

[workspace.dependencies]
chrono = "0.4"
getset = "0.1"
http = "1.3.1"
identity_core = { git = "https://github.com/iotaledger/identity", tag = "v1.6.0-beta.2" }
identity_credential = { git = "https://github.com/iotaledger/identity", tag = "v1.6.0-beta.2", default-features = false, features = [
    "validator",
    "credential",
    "presentation",
    "sd-jwt-vc",
] }
is_empty = "0.2"
jsonwebtoken = "9.3"
monostate = "0.1"
nutype = { version = "0.6", features = ["serde"] }
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }
reqwest-middleware = "0.2"
reqwest-retry = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_with = "3.0"
tokio = { version = "1.43.0", features = ["rt", "macros", "rt-multi-thread"] }
thiserror = "1.0"
url = { version = "2", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "fast-rng", "serde"] }
validator = { version = "0.19", features = ["derive"] }

# TODO: Fix these dependencies once publishing to crates.io is automated.
[dependencies]
oid4vc-core = { path = "oid4vc-core" }
oid4vci = { path = "oid4vci" }
oid4vp = { path = "oid4vp" }
siopv2 = { path = "siopv2" }
oid4vc-manager = { path = "oid4vc-manager" }
