[package]
name = "oid4vp"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Rust implementation of the OpenID Connect OpenID for Verifiable Presentations standard"
homepage.workspace = true
repository.workspace = true
keywords = ["oid4vc", "openid4vc", "oid4vp", "openid", "dcql"]
categories = ["authentication", "cryptography", "web-programming"]
readme = "README.md"
include = ["/src", "/README.md", "/CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
oid4vc-core.workspace = true
oid4vci.workspace = true

anyhow = "1.0"
chrono.workspace = true
futures = "0.3"
getset.workspace = true
identity-kit = { workspace = true, features = ["vc", "sd-jwt", "secp256k1"] }
is_empty.workspace = true
jsonwebtoken.workspace = true
monostate.workspace = true
nutype.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
oid4vc-core = { workspace = true, features = ["test-utils"] }

async-trait = "0.1"
identity-kit = { workspace = true, features = ["did-key", "in-memory"] }
